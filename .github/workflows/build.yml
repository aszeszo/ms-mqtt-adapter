name: Build and Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: aszeszo/ms-mqtt-adapter

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web/frontend

      - name: Build frontend
        run: npm run build
        working-directory: web/frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/
          retention-days: 1

  build:
    runs-on: ubuntu-latest
    needs: frontend
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, aarch64, armhf, armv7, i386]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: artifact-download

      - name: Move artifact to correct location
        run: |
          echo "=== Artifact contents ==="
          ls -la artifact-download/
          echo ""
          echo "Moving to web/dist/..."
          mkdir -p web/dist
          mv artifact-download/* web/dist/
          echo "✓ Files moved to web/dist/"
          ls -la web/dist/

      - name: Debug - Show what was downloaded
        run: |
          echo "=== Repository structure after artifact download ==="
          echo "Current directory: $(pwd)"
          echo ""
          echo "Full directory tree:"
          find . -type f -name "*.js" -o -name "*.html" | grep -E "(bundle|index)" | head -30
          echo ""
          echo "web/ directory contents:"
          ls -laR web/ || echo "web/ does not exist"
          echo ""
          echo "Checking specific locations:"
          [ -d "web/dist" ] && echo "✓ web/dist/ exists" || echo "✗ web/dist/ does NOT exist"
          [ -d "web/frontend/dist" ] && echo "✓ web/frontend/dist/ exists" || echo "✗ web/frontend/dist/ does NOT exist"

      - name: Verify artifact structure
        run: |
          echo "Checking artifact structure..."
          if [ ! -f "web/dist/bundle.js" ]; then
            echo "ERROR: web/dist/bundle.js not found!"
            echo "Directory structure:"
            find . -name "bundle.js" -o -name "index.html" | head -20
            ls -laR web/ 2>/dev/null || echo "web/ does not exist"
            exit 1
          fi
          if [ ! -f "web/dist/index.html" ]; then
            echo "ERROR: web/dist/index.html not found!"
            exit 1
          fi
          echo "✓ Artifact structure verified successfully"
          echo "✓ web/dist/bundle.js exists"
          echo "✓ web/dist/index.html exists"
          echo ""
          echo "Artifact directory contents:"
          ls -lah web/dist/

      - name: Get version from ha-addon config
        id: version
        run: |
          VERSION=$(grep '^version:' ha-addon/config.yaml | sed 's/version: *"\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set platform mapping
        id: platform
        run: |
          case ${{ matrix.arch }} in
            amd64) echo "platform=linux/amd64" >> $GITHUB_OUTPUT ;;
            aarch64) echo "platform=linux/arm64" >> $GITHUB_OUTPUT ;;
            armv7) echo "platform=linux/arm/v7" >> $GITHUB_OUTPUT ;;
            armhf) echo "platform=linux/arm/v6" >> $GITHUB_OUTPUT ;;
            i386) echo "platform=linux/386" >> $GITHUB_OUTPUT ;;
          esac

      - name: Debug - Verify web/dist before Docker build
        run: |
          echo "=== Verifying build context for ${{ matrix.arch }} ==="
          if [ ! -d "web/dist" ]; then
            echo "ERROR: web/dist/ directory does not exist!"
            exit 1
          fi
          echo "✓ web/dist/ directory exists"
          echo ""
          echo "Files in web/dist/:"
          ls -lah web/dist/
          echo ""
          echo "File count: $(find web/dist -type f | wc -l) files"
          echo "Required files check:"
          [ -f "web/dist/bundle.js" ] && echo "  ✓ bundle.js" || (echo "  ✗ bundle.js MISSING"; exit 1)
          [ -f "web/dist/index.html" ] && echo "  ✓ index.html" || (echo "  ✗ index.html MISSING"; exit 1)

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ci
          platforms: ${{ steps.platform.outputs.platform }}
          push: true
          provenance: false
          sbom: false
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:latest
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get version from ha-addon config
        id: version
        run: |
          VERSION=$(grep '^version:' ha-addon/config.yaml | sed 's/version: *"\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest for version tag
        run: |
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-aarch64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-armhf \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-armv7 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-i386
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}

      - name: Create and push manifest for latest tag
        run: |
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-aarch64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-armhf \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-armv7 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-i386
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
