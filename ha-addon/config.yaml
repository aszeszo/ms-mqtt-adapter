name: MySensors MQTT Adapter
version: "2.2.1"
slug: ms_mqtt_adapter
description: Bridge between MySensors networks and MQTT with Home Assistant auto-discovery
url: https://github.com/aszeszo/ms-mqtt-adapter
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
init: false
ingress: true
panel_icon: "mdi:chip"
panel_title: "MySensors"
image: ghcr.io/aszeszo/ms-mqtt-adapter
ports:
  5003/tcp: 5003
  5004/tcp: 5004
  5005/tcp: 5005
  5006/tcp: 5006
ports_description:
  5003/tcp: TCP service for MySensors message replication (gateway 1)
  5004/tcp: TCP service for MySensors message replication (gateway 2)
  5005/tcp: TCP service for MySensors message replication (gateway 3)
  5006/tcp: TCP service for MySensors message replication (gateway 4)
schema:
  config_yaml: str
options:
  config_yaml: |
    log_level: info  # debug, info, warn, error

    mysensors:
      main_house:  # First gateway becomes default (no special "default" handling)
        ethernet:
          host: "172.30.15.1"
          # port: 5003  # Default port, can be omitted
        gateway:
          node_id_assignment:
            enabled: true
            node_id_range:
              start: 1
              end: 254
            random_id_assignment: false
          version_request_period: "5s"  # Set to "0s" to disable entirely
        # tcp_service:
        #   enabled: false  # Disabled by default
        #   port: 5004      # Port required when enabled
      garage:
        ethernet:
          host: "172.30.16.1"
          port: 5003  # Use same MySensors port (different host)
        gateway:
          node_id_assignment:
            enabled: true
            node_id_range:
              start: 1
              end: 254
            random_id_assignment: false
        # tcp_service:
        #   enabled: false  # Disabled by default
        #   port: 5005      # Different TCP port required

    mqtt:
      broker: "core-mosquitto"
      port: 1883
      username: "nippy"
      password: "nippy"
      client_id: "ms-mqtt-adapter"

    # ID aliases for easier configuration - map friendly names to numeric IDs
    id_aliases:
      relay_controller: 3        # MySensors node ID 3
      input_controller: 1        # MySensors node ID 1
      relay_1: 0                 # Child ID 0
      relay_2: 1                 # Child ID 1
      relay_3: 2                 # Child ID 2
      button_1: 0                # Child ID 0
      button_2: 1                # Child ID 1
      button_3: 2                # Child ID 2
      button_4: 3                # Child ID 3
      button_5: 4                # Child ID 4
      button_6: 5                # Child ID 5

    adapter:
      topic_prefix: "ms-mqtt-adapter"
      homeassistant_discovery: true  # Enable/disable Home Assistant auto-discovery

    devices:
      - name: "Relay 3 #1"
        id: "relay_3_1"
        node_id: relay_controller    # Using alias instead of numeric 3
        manufacturer: "Nippy"
        model: "Relay 3"
        sw_version: "1.0.0"
        hw_version: "1.0.0"
        entities:
          - name: "Relay 1"
            id: "relay_1"
            child_id: relay_1        # Using alias instead of numeric 0
            entity_type: "switch"
            initial_value: "0"
            icon: "mdi:electric-switch"
            object_id: "main_relay_1" # Custom object_id (defaults to relay_3_1_relay_1)
            sync_period: "30s"       # Sync every 30 seconds
          - name: "Relay 2"
            id: "relay_2"
            child_id: relay_2        # Using alias instead of numeric 1
            entity_type: "switch"
            initial_value: "0"
            icon: "mdi:electric-switch"
            # object_id not specified - defaults to "relay_3_1_relay_2"
          - name: "Relay 3"
            id: "relay_3"
            child_id: relay_3        # Using alias instead of numeric 2
            entity_type: "switch"
            initial_value: "0"
            icon: "mdi:electric-switch"
            # No object_id - uses default "relay_3_1_relay_3"

      - name: "Input 6 #1"
        id: "input_6_1"
        node_id: input_controller   # Using alias instead of numeric 1
        manufacturer: "Nippy"
        model: "Input 6"
        sw_version: "0.0.20251218211121"
        hw_version: "0.0.20251218211121"
        entities:
          - name: "Input Button 1"
            id: "input_button_1"
            child_id: button_1       # Using alias instead of numeric 0
            entity_type: "binary_sensor"
            read_only: true
            icon: "mdi:button-pointer"
          - name: "Input Button 2"
            id: "input_button_2"
            child_id: button_2       # Using alias instead of numeric 1
            entity_type: "binary_sensor"
            read_only: true
            icon: "mdi:button-pointer"
          - name: "Input Button 3"
            id: "input_button_3"
            child_id: button_3       # Using alias instead of numeric 2
            entity_type: "binary_sensor"
            read_only: true
            icon: "mdi:button-pointer"
          - name: "Input Button 4"
            id: "input_button_4"
            child_id: button_4       # Using alias instead of numeric 3
            entity_type: "binary_sensor"
            read_only: true
            icon: "mdi:button-pointer"
          - name: "Input Button 5"
            id: "input_button_5"
            child_id: button_5       # Using alias instead of numeric 4
            entity_type: "binary_sensor"
            read_only: true
            icon: "mdi:button-pointer"
          - name: "Input Button 6"
            id: "input_button_6"
            child_id: button_6       # Using alias instead of numeric 5
            entity_type: "binary_sensor"
            read_only: true
            icon: "mdi:button-pointer"
            object_id: ""            # Exclude object_id from discovery entirely

      # Example device demonstrating various entity types
      - name: "Smart Display #1"
        id: "smart_display_1"
        node_id: 6
        manufacturer: "Nippy"
        model: "Smart Display"
        sw_version: "0.0.20251218211121"
        hw_version: "0.0.20251218211121"
        entities:
          # Text entity - allows setting arbitrary text messages
          - name: "Display Message"
            id: "display_message"
            child_id: 0
            entity_type: "text"
            initial_value: "Hello World"
            icon: "mdi:message-text"
            object_id: "smart_display_message"  # Custom entity ID
            entity_category: "config"
          
          # Number entity - allows setting numeric values with range
          - name: "Brightness Level"
            id: "brightness_level"
            child_id: 1
            entity_type: "number"
            initial_value: "50"
            min_value: 0
            max_value: 100
            step: 5
            unit_of_measurement: "%"
            icon: "mdi:brightness-6"
            
          # Select entity - allows choosing from predefined options
          - name: "Display Mode"
            id: "display_mode"
            child_id: 2
            entity_type: "select"
            initial_value: "normal"
            options: ["normal", "bright", "dim", "off"]
            icon: "mdi:monitor"
            
          # Switch entity
          - name: "Backlight Power"
            id: "backlight_power"
            child_id: 3
            entity_type: "switch"
            initial_value: "1"
            icon: "mdi:lightbulb"

      - name: "Environment Sensor"
        id: "env_sensor"
        gateway: garage             # Uses garage gateway
        node_id: 159
        manufacturer: "Nippy"
        model: "Environment Pro"
        sw_version: "0.0.20251218211121"
        hw_version: "0.0.20251218211121"
        entities:
          - name: "Temperature"
            id: "temperature"
            child_id: 0
            entity_type: "temperature"
            read_only: true
            icon: "mdi:thermometer"
          - name: "Humidity"
            id: "humidity"
            child_id: 1
            entity_type: "humidity"
            read_only: true
            icon: "mdi:water-percent"
          - name: "Battery Level"
            id: "battery"
            child_id: 2
            entity_type: "battery"
            read_only: true
            entity_category: "diagnostic"
            icon: "mdi:battery"
